[project]
name = "pixel-alchemy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NoRaincheck", email = "2498638+NoRaincheck@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "controlnet-aux>=0.0.10",
    "huggingface_hub>=0.20.0",
    "img2pdf>=0.6.3",
    "numpy>=1.24.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "safetensors>=0.4.0",
    "scipy>=1.10.0",
    "sh>=2.3.0",
    "soundfile>=0.12.0",
    "onnxscript>=0.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "vtracer>=0.6.15",
]

[project.optional-dependencies]
tau = [
    "tau-ai @ git+https://github.com/huggingface/tau.git",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deno>=2.9.4",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.ruff]
line-length = 120

[tool.uv.sources]
tau-ai = { git = "https://github.com/huggingface/tau.git" }
